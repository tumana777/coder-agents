
name: CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  # -----------------------------------
  # Backend Tests
  # -----------------------------------

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        run: |
          pytest -v


  # -----------------------------------
  # Frontend Checks
  # -----------------------------------

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend/requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q frontend


  # -----------------------------------
  # Docker CI
  # -----------------------------------

  docker-ci:
    name: Docker CI
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci_user
          POSTGRES_PASSWORD=ci_password
          POSTGRES_DB=ci_db
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          MODEL=ci-model
          GOOGLE_API_KEY=ci-placeholder
          EOF

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet

      - name: Build Docker images
        run: |
          docker compose build --pull backend frontend

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd /root/coder-agents &&
             git pull --ff-only origin master &&
             docker compose build --pull backend frontend &&
             docker compose up -d"